<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paleta 5 — Futuro Sustentável | YXZ Soluções Educacionais</title>
  <meta name="theme-color" content="#26124d">
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <style>
    .thanks-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      color: #fff;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 207, 69, .28), transparent 28rem),
        radial-gradient(circle at 85% 20%, rgba(255, 122, 69, .28), transparent 30rem),
        linear-gradient(135deg, #170c35, #34176b);
    }
    .thanks-card {
      max-width: 720px;
      padding: 42px;
      border-radius: 36px;
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.2);
      backdrop-filter: blur(20px);
      box-shadow: 0 30px 90px rgba(0,0,0,.22);
      text-align: center;
    }
    .thanks-card img {
      width: 240px;
      margin: 0 auto 34px;
    }
    .thanks-card h1 {
      font-size: clamp(3rem, 8vw, 5rem);
    }
    .thanks-card p {
      color: rgba(255,255,255,.78);
    }
    .thanks-card .btn {
      margin-top: 22px;
    }
  </style>
</head>
<body>
  <main class="thanks-page">
    <section class="thanks-card">
      <img src="assets/yxz-robotic-logo-white.png" alt="YXZROBOTIC Educação Tecnológica">
      <h1>Solicitação recebida.</h1>
      <p>Obrigado pelo contato. Em breve a equipe poderá retornar com os próximos passos da proposta.</p>
      <a class="btn btn-primary" href="index.html">Voltar ao site</a>
    </section>
  </main>
  <div class="palette-test-badge">Paleta 5 · Futuro Sustentável</div>
</body>
</html>
